<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Company Profile</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">Aurora</span>
      <span class="brand-sub">Solutions</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="index.html">Company Profile</a>
      <a href="contact.html">Contact Us</a>
      <a href="gallery.html" class="active" aria-current="page">Gallery</a>
    </nav>
  </header>

  <main>
    <section class="hero hero-compact">
      <div class="hero-inner">
        <h1>Gallery</h1>
        <p class="lead">A look at our team, workspace, and the work we do.</p>
      </div>
    </section>

    <section class="section">
      <div class="gallery-grid">
        <figure class="gallery-item">
          <img src="assets/img/gallery-1.svg" alt="Team collaborating in the office" width="600" height="400">
          <figcaption>Collaboration</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="assets/img/gallery-2.svg" alt="Product design workshop" width="600" height="400">
          <figcaption>Design workshops</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="assets/img/gallery-3.svg" alt="Engineering pairing session" width="600" height="400">
          <figcaption>Engineering</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="assets/img/gallery-4.svg" alt="Company event" width="600" height="400">
          <figcaption>Community</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; Aurora Solutions. All rights reserved.</p>
    <nav aria-label="Footer">
      <a href="index.html">Company Profile</a>
      <a href="contact.html">Contact Us</a>
      <a href="gallery.html">Gallery</a>
    </nav>
  </footer>
</body>
</html>
